<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Pannello Admin</title>
<meta name="theme-color" content="#2a1218">
<link rel="icon" href="icons/icon-192.png">
<style>
:root{--bg:#f6f1e7;--card:#fff;--ink:#2a1218;--muted:#7a6a6e;--line:#e6dccb;--acc:#5b1023;--gold:#d4a84b;--ok:#2f8f5b;--ko:#c0392b}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,system-ui,Inter,sans-serif;background:var(--bg);color:var(--ink);font-size:16px}
header{position:sticky;top:0;z-index:5;background:var(--acc);color:#fbf5e9;padding:calc(env(safe-area-inset-top) + 12px) 16px 0}
header h1{font-size:18px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
header .mode{margin-left:auto;font-size:11px;font-weight:600;background:#ffffff22;padding:4px 8px;border-radius:8px}
nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav button{border:none;background:none;color:#e8cfd5;padding:10px 12px;font:inherit;font-size:14px;font-weight:600;border-bottom:3px solid transparent;white-space:nowrap}
nav button.on{color:#fff;border-color:var(--gold)}
main{max-width:720px;margin:0 auto;padding:16px 16px 120px}
.tab{display:none}.tab.on{display:block}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.box h3{margin:0 0 10px;font-size:15px}
label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:10px 0 4px}
input,textarea,select{width:100%;font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fffdf9;color:var(--ink)}
textarea{min-height:70px;resize:vertical}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}
.opt-row{display:flex;gap:8px;align-items:center;margin:6px 0}
.opt-row input[type=radio]{width:22px;height:22px;flex:none;accent-color:var(--ok)}
.btn{border:none;border-radius:10px;padding:11px 14px;font:inherit;font-weight:700;font-size:14px;background:#efe6d6;color:var(--ink);cursor:pointer}
.btn.pri{background:var(--acc);color:#fff}
.btn.ok{background:var(--ok);color:#fff}
.btn.ko{background:#fbe4e1;color:var(--ko)}
.btn.sm{padding:7px 10px;font-size:13px}
.tools{display:flex;gap:6px;justify-content:flex-end;margin-top:10px;flex-wrap:wrap}
.muted{color:var(--muted);font-size:13px;line-height:1.45}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:#fffdf9ee;backdrop-filter:blur(6px);border-top:1px solid var(--line);
  padding:10px 16px calc(env(safe-area-inset-bottom) + 10px);display:flex;gap:8px;justify-content:center}
.bar .btn{flex:1;max-width:240px;padding:14px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:9}
.toast.show{opacity:1}
.env-status{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.env-status:last-child{border:none}
.pill{font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px;background:#efe6d6}
.pill.ok{background:#e3f5ea;color:var(--ok)}
.order-item{display:flex;align-items:center;gap:8px;padding:10px;border:1px solid var(--line);border-radius:10px;margin:6px 0;background:#fffdf9}
.order-item b{flex:1}
.switch{display:flex;align-items:center;gap:10px;margin-top:12px;font-weight:600}
.switch input{width:22px;height:22px;accent-color:var(--acc)}
#login{max-width:380px;margin:60px auto;padding:0 16px}
.err{color:var(--ko);font-size:14px;min-height:20px;margin-top:8px}
.warn{background:#fff6dc;border:1px solid #f3d68a;border-radius:12px;padding:12px;font-size:13px;line-height:1.45;margin-bottom:14px}
</style>
</head>
<body>

<div id="login" hidden>
  <div class="box">
    <h3>🔐 Accesso admin</h3>
    <label>Email</label><input id="lEmail" type="email" autocomplete="username">
    <label>Password</label><input id="lPass" type="password" autocomplete="current-password">
    <button class="btn pri" id="lGo" style="width:100%;margin-top:14px">Entra</button>
    <div class="err" id="lErr"></div>
  </div>
</div>

<div id="app" hidden>
  <header>
    <h1>🎓 Pannello Admin <span class="mode" id="mode"></span></h1>
    <nav id="nav">
      <button data-t="testi" class="on">Testi</button>
      <button data-t="quiz">Quiz</button>
      <button data-t="enigmi">Enigmi</button>
      <button data-t="diff">Difficoltà e ordine</button>
      <button data-t="premio">Premio finale</button>
      <button data-t="stato">Stato</button>
    </nav>
  </header>
  <main>
    <div class="warn" id="localWarn" hidden>Stai usando la <b>modalità locale</b>: le modifiche valgono solo su questo dispositivo. Per salvarle online inserisci URL e chiave di Supabase in <code>config.js</code>.</div>
    <section class="tab on" id="t-testi"></section>
    <section class="tab" id="t-quiz"></section>
    <section class="tab" id="t-enigmi"></section>
    <section class="tab" id="t-diff"></section>
    <section class="tab" id="t-premio"></section>
    <section class="tab" id="t-stato"></section>
  </main>
  <div class="bar">
    <button class="btn" id="bPreview">👁 Anteprima</button>
    <button class="btn pri" id="bSave">💾 Salva</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="data.js"></script>
<script src="admin.js"></script>
</body>
</html>
