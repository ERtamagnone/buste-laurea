<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Le Buste del Dottore</title>
<meta name="theme-color" content="#5b1023">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Le Buste">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,800;1,600&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bord:#5b1023; --bord2:#7d1a33; --gold:#d4a84b; --gold2:#f3d68a; --cream:#fbf5e9;
  --ink:#2a1218; --muted:#8a6a70; --ok:#2f8f5b; --ko:#c0392b;
  --safe-t:env(safe-area-inset-top); --safe-b:env(safe-area-inset-bottom);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:#3a0816}
html,body{margin:0;height:100%;overscroll-behavior:none}
body{
  font-family:Inter,-apple-system,system-ui,sans-serif;color:var(--cream);
  background:radial-gradient(120% 80% at 50% 0%,var(--bord2),var(--bord) 60%,#3a0816);
  background-attachment:fixed;min-height:100dvh;
  touch-action:manipulation;-webkit-user-select:none;user-select:none;
}
button{font:inherit;touch-action:manipulation;cursor:pointer}
.serif{font-family:"Playfair Display",Georgia,serif}
.screen{display:none;min-height:100dvh;padding:calc(var(--safe-t) + 16px) 16px calc(var(--safe-b) + 24px);max-width:520px;margin:0 auto;flex-direction:column}
.screen.active{display:flex;animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* header */
.hero{text-align:center;padding:12px 0 8px}
.cap{font-size:54px;line-height:1;filter:drop-shadow(0 6px 10px rgba(0,0,0,.35))}
.hero h1{font-size:38px;margin:6px 0 2px;color:var(--gold2);letter-spacing:.5px}
.laurel{color:var(--gold);font-size:13px;letter-spacing:3px;text-transform:uppercase}
.degree{font-size:13px;color:#e8cfd5;margin:6px 8px 0;line-height:1.4}
.dedication{background:rgba(255,255,255,.07);border:1px solid rgba(212,168,75,.35);border-radius:16px;padding:14px 16px;margin:16px 0 18px;line-height:1.5;font-size:15px;text-align:center}

/* cards */
.cards{display:flex;flex-direction:column;gap:12px}
.card{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:none;border-radius:18px;padding:14px 16px;
  background:var(--cream);color:var(--ink);box-shadow:0 8px 20px rgba(0,0,0,.25);transition:transform .15s}
.card:active{transform:scale(.98)}
.card .ico{width:54px;height:54px;flex:none;border-radius:14px;display:grid;place-items:center;font-size:28px;background:#f1e4c8}
.card .t{font-weight:700;font-size:16px}
.card .s{font-size:13px;color:var(--muted);margin-top:2px}
.card .badge{margin-left:auto;font-size:12px;font-weight:700;padding:6px 10px;border-radius:99px;background:var(--bord);color:var(--gold2);white-space:nowrap}
.card.won{background:linear-gradient(135deg,#fff6dc,#f3d68a)}
.card.won .badge{background:var(--ok);color:#fff}
.card.locked{opacity:.55;filter:grayscale(.6)}
.card.mystery{background:linear-gradient(135deg,#2a1218,#4a1426);color:var(--cream);border:1px dashed var(--gold)}
.card.mystery .ico{background:rgba(212,168,75,.2)}
.card.mystery .s{color:#d9bcc3}
.card.mystery.ready{animation:glow 1.8s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 4px rgba(243,214,138,.45),0 8px 24px rgba(0,0,0,.35)}}
.counter{text-align:center;margin:18px 0 4px;color:var(--gold2);font-size:14px}
.hint{font-size:12px;color:var(--gold2);margin-top:4px;font-style:italic}

/* topbar */
.top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.back{border:none;background:rgba(255,255,255,.12);color:var(--cream);width:40px;height:40px;border-radius:12px;font-size:20px}
.top h2{margin:0;font-size:22px;color:var(--gold2)}
.intro{color:#ecd7dc;font-size:14px;line-height:1.45;margin:0 0 14px}
.panel{background:var(--cream);color:var(--ink);border-radius:20px;padding:18px;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.btn{display:block;width:100%;border:none;border-radius:14px;padding:15px;font-weight:700;font-size:16px;background:var(--gold);color:var(--ink);margin-top:14px;box-shadow:0 4px 0 #9c7a2e}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #9c7a2e}
.btn.secondary{background:#efe3cc;box-shadow:0 4px 0 #cdbb98}

/* quiz */
.progressbar{height:6px;background:#eadcc0;border-radius:6px;overflow:hidden;margin-bottom:14px}
.progressbar i{display:block;height:100%;background:var(--bord);transition:width .3s}
.qnum{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:1px;text-transform:uppercase}
.qtext{font-size:20px;margin:6px 0 14px;line-height:1.3}
.opt{display:block;width:100%;text-align:left;padding:14px 16px;margin:8px 0;border-radius:14px;border:2px solid #e6d6b6;background:#fff;font-size:16px;color:var(--ink);transition:.15s}
.opt.ok{border-color:var(--ok);background:#e3f5ea}
.opt.ko{border-color:var(--ko);background:#fbe4e1}
.result{text-align:center;padding:10px 0}
.result .big{font-size:56px}

/* factory */
.hud{display:flex;justify-content:space-between;align-items:center;font-weight:700;margin-bottom:8px}
.hud .lives{font-size:20px;letter-spacing:2px}
#factoryCanvas{width:100%;height:320px;border-radius:18px;background:#1f0b12;display:block;touch-action:none}

/* puzzle */
.slots,.tiles{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;min-height:50px;margin:10px 0}
.tile{width:40px;height:46px;border-radius:10px;border:none;font-weight:800;font-size:20px;background:var(--bord);color:var(--gold2);box-shadow:0 3px 0 #2e0711}
.tile.used{visibility:hidden}
.slot{width:40px;height:46px;border-radius:10px;border:2px dashed #cdb88d;display:grid;place-items:center;font-weight:800;font-size:20px;color:var(--bord);background:#fff}
.slot.filled{border-style:solid;border-color:var(--gold)}
.slot.solved{background:#e3f5ea;border-color:var(--ok);color:var(--ok)}
.row2{display:flex;gap:8px}.row2 .btn{margin-top:6px;font-size:14px;padding:12px}
.whint{min-height:20px;text-align:center;color:var(--muted);font-style:italic;font-size:14px}
.wordsdone{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-bottom:6px}
.wordsdone span{font-size:12px;padding:4px 10px;border-radius:99px;background:#efe3cc;color:var(--muted);font-weight:700}
.wordsdone span.done{background:var(--ok);color:#fff}
.code{display:flex;gap:10px;justify-content:center;margin:14px 0}
.code input{width:64px;height:72px;text-align:center;font-size:34px;font-weight:800;border-radius:14px;border:2px solid #cdb88d;color:var(--bord);background:#fff;font-family:inherit}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-4px)}}

/* overlay envelope */
.overlay{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;flex-direction:column;
  background:rgba(25,4,10,.88);padding:calc(var(--safe-t) + 20px) 16px calc(var(--safe-b) + 20px);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.overlay.show{display:flex}
.env-wrap{perspective:900px;width:min(86vw,340px);height:230px;position:relative;margin-top:150px}
.env{position:absolute;inset:0;background:#e9d3a6;border-radius:10px;box-shadow:0 20px 40px rgba(0,0,0,.5)}
.env::before{content:"";position:absolute;inset:0;border-radius:10px;
  background:linear-gradient(32deg,#dcc08a 50%,transparent 50.4%) left/51% 100% no-repeat,linear-gradient(-32deg,#dcc08a 50%,transparent 50.4%) right/51% 100% no-repeat;z-index:3}
.env::after{content:"";position:absolute;left:0;right:0;bottom:0;height:62%;background:#e4c993;clip-path:polygon(0 100%,50% 18%,100% 100%);border-radius:0 0 10px 10px;z-index:4}
.flap{position:absolute;left:0;right:0;top:0;height:60%;background:#d8b878;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;z-index:5;transition:transform .7s ease .3s}
.seal{position:absolute;left:50%;top:48%;width:56px;height:56px;margin:-28px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#b2263f,#6d0f22);z-index:6;
  display:grid;place-items:center;color:var(--gold2);font-family:"Playfair Display",serif;font-weight:800;font-size:24px;box-shadow:0 3px 6px rgba(0,0,0,.4);transition:opacity .3s}
.letter{position:absolute;left:7%;right:7%;top:8%;height:86%;background:#fffdf7;border-radius:6px;z-index:2;padding:16px;text-align:center;color:var(--ink);
  transition:transform .9s cubic-bezier(.2,.8,.2,1) 1s;box-shadow:0 4px 12px rgba(0,0,0,.2);display:flex;flex-direction:column;justify-content:center}
.letter .ln{font-family:"Playfair Display",serif;font-size:28px;color:var(--bord);font-weight:800}
.letter .lm{font-size:15px;margin-top:8px;line-height:1.4}
.overlay.open .flap{transform:rotateX(180deg);z-index:1}
.overlay.open .seal{opacity:0}
.overlay.open .letter{transform:translateY(-62%);z-index:7}
.ov-title{font-family:"Playfair Display",serif;color:var(--gold2);font-size:30px;text-align:center;margin:0;position:absolute;top:calc(var(--safe-t) + 40px);left:16px;right:16px}
.ov-actions{width:min(86vw,340px);margin-top:28px}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:60}

/* scratch */
.scratch{position:relative;height:220px;border-radius:18px;overflow:hidden;background:linear-gradient(135deg,#fff6dc,#f3d68a);display:grid;place-items:center;text-align:center;padding:20px;color:var(--ink)}
.scratch .msg{font-family:"Playfair Display",serif;font-size:22px;line-height:1.35;color:var(--bord)}
#scratchCanvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.gift{font-size:80px;text-align:center;margin:8px 0;animation:wobble 2.4s ease-in-out infinite}
@keyframes wobble{0%,100%{transform:rotate(0)}25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
.preview-flag{position:fixed;top:calc(var(--safe-t) + 6px);right:8px;z-index:70;background:#000a;color:#fff;font-size:11px;padding:4px 8px;border-radius:8px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<!-- HOME -->
<section class="screen active" id="home">
  <div class="hero">
    <div class="cap">🎓</div>
    <div class="laurel">🌿 Laurea Magistrale 🌿</div>
    <h1 class="serif" id="hTitle">Dott.</h1>
    <div class="degree" id="hDegree"></div>
  </div>
  <div class="dedication" id="hDedication"></div>
  <div class="cards" id="cards"></div>
  <div class="counter" id="counter"></div>
</section>

<!-- QUIZ -->
<section class="screen" id="quiz">
  <div class="top"><button class="back" data-home>‹</button><h2 class="serif" id="qTitle"></h2></div>
  <p class="intro" id="qIntro"></p>
  <div class="panel" id="qPanel"></div>
</section>

<!-- FACTORY -->
<section class="screen" id="factory">
  <div class="top"><button class="back" data-home>‹</button><h2 class="serif" id="fTitle"></h2></div>
  <p class="intro" id="fIntro"></p>
  <div class="hud"><span id="fScore">0 / 10 ✅</span><span class="lives" id="fLives"></span></div>
  <canvas id="factoryCanvas"></canvas>
  <button class="btn" id="fStart">Avvia la linea ▶</button>
</section>

<!-- PUZZLE -->
<section class="screen" id="puzzle">
  <div class="top"><button class="back" data-home>‹</button><h2 class="serif" id="pTitle"></h2></div>
  <p class="intro" id="pIntro"></p>
  <div class="panel" id="pPanel"></div>
</section>

<!-- FINAL -->
<section class="screen" id="final">
  <div class="top"><button class="back" data-home>‹</button><h2 class="serif" id="xTitle"></h2></div>
  <div class="gift">🎁</div>
  <p class="intro" style="text-align:center">Collaudo finale: gratta la patina dorata con il dito!</p>
  <div class="scratch"><div class="msg" id="xMsg"></div><canvas id="scratchCanvas"></canvas></div>
  <div id="xHints"></div>
  <button class="btn" data-home id="xDone" style="display:none">Torna alla home</button>
</section>

<!-- ENVELOPE OVERLAY -->
<div class="overlay" id="overlay">
  <h2 class="ov-title" id="ovTitle">Hai vinto!</h2>
  <div class="env-wrap">
    <div class="letter"><div class="ln" id="ovN"></div><div class="lm" id="ovMsg"></div></div>
    <div class="env"></div>
    <div class="flap"></div>
    <div class="seal" id="ovSeal"></div>
  </div>
  <div class="ov-actions"><button class="btn" id="ovClose">Torna alla home</button></div>
</div>
<canvas id="confetti"></canvas>

<script src="vendor/supabase.js"></script>
<script src="config.js"></script>
<script src="data.js"></script>
<script>
(function(){
const PREVIEW = new URLSearchParams(location.search).has("preview");
const NAMES = { quiz:"Quiz", factory:"Catena di montaggio", puzzle:"Enigma" };
const ICONS = { quiz:"🧠", factory:"⚙️", puzzle:"🧩" };
let CFG = window.DEFAULT_CONFIG, PROG = { envelopes:[], final_claimed_at:null };
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const buzz = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch(e){} };

if (PREVIEW) { const f=document.createElement("div"); f.className="preview-flag"; f.textContent="ANTEPRIMA"; document.body.appendChild(f); }

/* ---------- navigation ---------- */
let stopGame = () => {};
function show(id){
  stopGame();
  document.querySelectorAll(".screen").forEach(s => s.classList.toggle("active", s.id === id));
  window.scrollTo(0,0);
  if (id === "home") renderHome();
}
document.addEventListener("click", e => { if (e.target.closest("[data-home]")) show("home"); });

const wonSet = () => new Set(PROG.envelopes.map(e => e.n));
const envFor = ch => CFG.order.indexOf(ch) + 1;

async function win(challenge){
  const n = envFor(challenge);
  if (!PREVIEW) PROG = await DB.win(n, challenge);
  else if (!wonSet().has(n) && PROG.envelopes.length < 3) PROG.envelopes.push({ n, challenge, at:new Date().toISOString() });
  openEnvelope(n);
}

/* ---------- home ---------- */
function renderHome(){
  $("#hTitle").textContent = CFG.title;
  $("#hDegree").textContent = CFG.degree;
  $("#hDedication").textContent = CFG.dedication;
  const won = wonSet(), box = $("#cards");
  box.innerHTML = "";
  CFG.order.forEach((ch, i) => {
    const n = i + 1, isWon = won.has(n);
    const locked = !isWon && CFG.sequential && i > 0 && !won.has(i);
    const c = document.createElement("button");
    c.className = "card" + (isWon ? " won" : "") + (locked ? " locked" : "");
    c.innerHTML = `<div class="ico">${isWon ? "💌" : locked ? "🔒" : ICONS[ch]}</div>
      <div><div class="t">${esc(CFG.envelopes[i]?.title || "Busta n. " + n)}</div>
      <div class="s">${esc(CFG[ch]?.title || NAMES[ch])}</div></div>
      <span class="badge">${isWon ? "Vinta ✓" : locked ? "Bloccata" : "Gioca"}</span>`;
    c.onclick = () => {
      if (isWon) return openEnvelope(n);
      if (locked) { c.classList.add("shake"); buzz(30); setTimeout(()=>c.classList.remove("shake"),400); return; }
      start(ch);
    };
    box.appendChild(c);
  });
  // mystery prize
  const ready = won.size >= 3, claimed = !!PROG.final_claimed_at;
  const m = document.createElement("button");
  m.className = "card mystery" + (ready && !claimed ? " ready" : "");
  const hints = (CFG.final.hints || []).filter(Boolean);
  m.innerHTML = `<div class="ico">${ready ? "🎁" : "❓"}</div>
    <div><div class="t">${ready ? esc(CFG.final.title) : "???"}</div>
    <div class="s">${ready ? (claimed ? "Riscattato ✓ — tocca per rivederlo" : "Sbloccato! Tocca per il collaudo finale") : esc(CFG.final.lockedText)}</div>
    ${hints.length ? `<div class="hint">Indizio: ${esc(hints[Math.min(won.size, hints.length-1)])}</div>` : ""}</div>`;
  m.onclick = () => { if (!ready) { m.classList.add("shake"); setTimeout(()=>m.classList.remove("shake"),400); return; } startFinal(); };
  box.appendChild(m);
  $("#counter").textContent = `Buste conquistate: ${won.size} / 3`;
}

function start(ch){ ({ quiz:startQuiz, factory:startFactory, puzzle:startPuzzle })[ch](); }

/* ---------- QUIZ ---------- */
function startQuiz(){
  const Q = CFG.quiz, qs = (Q.questions || []).filter(q => q.q && q.options?.length);
  $("#qTitle").textContent = Q.title; $("#qIntro").textContent = Q.intro;
  const need = Math.min(Q.threshold || qs.length, qs.length);
  let i = 0, score = 0;
  const panel = $("#qPanel");
  function ask(){
    if (i >= qs.length) return done();
    const q = qs[i];
    panel.innerHTML = `<div class="progressbar"><i style="width:${i/qs.length*100}%"></i></div>
      <div class="qnum">Domanda ${i+1} di ${qs.length}</div><div class="qtext serif">${esc(q.q)}</div>`;
    let answered = false;
    q.options.forEach((o, k) => {
      const b = document.createElement("button"); b.className = "opt"; b.textContent = o;
      b.onclick = () => {
        if (answered) return; answered = true;
        const right = k === Number(q.correct);
        b.classList.add(right ? "ok" : "ko");
        if (right) { score++; buzz(15); } else { buzz([40,40,40]); panel.querySelectorAll(".opt")[q.correct]?.classList.add("ok"); }
        setTimeout(() => { i++; ask(); }, right ? 700 : 1300);
      };
      panel.appendChild(b);
    });
  }
  function done(){
    if (score >= need) { panel.innerHTML = `<div class="result"><div class="big">🏆</div><h3 class="serif">${score} / ${qs.length}!</h3><p>Promosso con lode!</p></div>`; setTimeout(()=>win("quiz"), 900); return; }
    panel.innerHTML = `<div class="result"><div class="big">😅</div><h3 class="serif">${score} / ${qs.length}</h3>
      <p>Ne servivano almeno ${need}. Niente panico: c'è l'appello di recupero!</p></div>`;
    const b = document.createElement("button"); b.className = "btn"; b.textContent = "Riprova l'esame ↻";
    b.onclick = () => { i = 0; score = 0; ask(); }; panel.appendChild(b);
  }
  show("quiz"); ask();
}

/* ---------- FACTORY ---------- */
function startFactory(){
  const F = CFG.factory;
  $("#fTitle").textContent = F.title; $("#fIntro").textContent = F.intro;
  const cv = $("#factoryCanvas"), ctx = cv.getContext("2d");
  const btn = $("#fStart");
  let W, H, dpr, raf = 0, running = false, items = [], score, lives, last, spawnT, regen, msg = "";
  const target = Math.max(1, +F.target || 10), maxLives = Math.max(1, +F.lives || 3);
  const speed = Math.max(20, +F.speed || 70), rate = Math.min(.8, Math.max(0, +F.defectRate || .35));
  function size(){ dpr = devicePixelRatio || 1; W = cv.clientWidth; H = cv.clientHeight; cv.width = W*dpr; cv.height = H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); }
  function hud(){ $("#fScore").textContent = `${score} / ${target} ✅`; $("#fLives").textContent = "❤️".repeat(lives) + "🤍".repeat(maxLives - lives); }
  function gear(x, y, r, bad, rot){
    ctx.save(); ctx.translate(x,y); ctx.rotate(rot);
    const teeth = 9; ctx.beginPath();
    for (let k = 0; k < teeth*2; k++){ if (bad && k === 4) { ctx.lineTo(Math.cos(k/teeth*Math.PI)*r*.7, Math.sin(k/teeth*Math.PI)*r*.7); continue; }
      const rr = k % 2 ? r*.78 : r; const a = k/teeth*Math.PI; ctx.lineTo(Math.cos(a)*rr, Math.sin(a)*rr); }
    ctx.closePath(); ctx.fillStyle = bad ? "#8f2a2a" : "#d4a84b"; ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = bad ? "#4a0d0d" : "#8a6420"; ctx.stroke();
    ctx.beginPath(); ctx.arc(0,0,r*.3,0,7); ctx.fillStyle = "#1f0b12"; ctx.fill();
    ctx.restore();
    if (bad){ ctx.strokeStyle = "#ffdddd"; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(x-r*.5,y-r*.6); ctx.lineTo(x-r*.05,y-r*.1); ctx.lineTo(x-r*.3,y+r*.15); ctx.lineTo(x+r*.4,y+r*.6); ctx.stroke(); }
  }
  function draw(t){
    ctx.clearRect(0,0,W,H);
    const by = H*.62;
    // belt
    ctx.fillStyle = "#3b1621"; ctx.fillRect(0, by-6, W, 52);
    ctx.fillStyle = "#552331"; const off = (t/1000*speed) % 30;
    for (let x = -30 + off; x < W; x += 30) ctx.fillRect(x, by+2, 14, 36);
    ctx.fillStyle = "#2a0d16"; ctx.fillRect(0, by+46, W, 8);
    // scanner / exit
    ctx.fillStyle = "rgba(212,168,75,.15)"; ctx.fillRect(W-46, 0, 46, H);
    ctx.fillStyle = "#d4a84b"; ctx.font = "600 12px Inter, sans-serif"; ctx.textAlign = "center";
    ctx.save(); ctx.translate(W-23, 70); ctx.rotate(Math.PI/2); ctx.fillText("CONTROLLO QUALITÀ", 0, 4); ctx.restore();
    for (const it of items){
      if (it.pop){ ctx.globalAlpha = Math.max(0, 1 - it.pop); gear(it.x, it.y - it.pop*60, 26*(1+it.pop), it.bad, it.rot); ctx.globalAlpha = 1; }
      else gear(it.x, it.y, 26, it.bad, it.rot);
    }
    if (msg){ ctx.fillStyle = "rgba(0,0,0,.55)"; ctx.fillRect(0,0,W,H); ctx.fillStyle = "#f3d68a"; ctx.font = "800 24px 'Playfair Display', serif"; ctx.textAlign = "center";
      msg.split("\n").forEach((l, k) => ctx.fillText(l, W/2, H/2 - 14 + k*32)); }
  }
  function loop(t){
    const dt = Math.min(.05, (t - last)/1000); last = t;
    spawnT -= dt;
    if (spawnT <= 0){ items.push({ x:-30, y:H*.62+20 - 26, bad: Math.random() < rate, rot:Math.random()*6 }); spawnT = Math.max(.9, 130/speed*1.2) * (0.8 + Math.random()*.6); }
    for (const it of items){
      if (it.pop) { it.pop += dt*2.5; continue; }
      it.x += speed*dt; it.rot += dt*1.5;
      if (it.x > W - 30){
        it.dead = true;
        if (it.bad){ lives--; buzz([60,40,60]); flash("Difetto sfuggito!"); }
        else { score++; regen++; if (regen >= 4 && lives < maxLives){ lives++; regen = 0; } }
        hud();
      }
    }
    items = items.filter(it => !it.dead && !(it.pop && it.pop >= 1));
    draw(t);
    if (score >= target) return end(true);
    if (lives <= 0) return end(false);
    raf = requestAnimationFrame(loop);
  }
  let flashT = 0;
  function flash(s){ $("#fIntro").textContent = s; clearTimeout(flashT); flashT = setTimeout(()=>$("#fIntro").textContent = F.intro, 1200); }
  function end(ok){
    running = false; cancelAnimationFrame(raf);
    if (ok){ msg = "Zero difetti!\nLinea promossa 🏆"; draw(performance.now()); buzz(80); setTimeout(()=>win("factory"), 1000); }
    else { msg = "Linea ferma!\nRiprova, Ingegnere 🔧"; draw(performance.now()); btn.style.display = "block"; btn.textContent = "Riavvia la linea ↻"; }
  }
  function go(){
    size(); items = []; score = 0; lives = maxLives; regen = 0; spawnT = .3; msg = ""; hud();
    btn.style.display = "none"; running = true; last = performance.now(); raf = requestAnimationFrame(loop);
  }
  cv.onpointerdown = e => {
    if (!running) return;
    const r = cv.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
    let best = null, bd = 48;
    for (const it of items){ if (it.pop) continue; const d = Math.hypot(it.x - x, it.y - y); if (d < bd){ bd = d; best = it; } }
    if (!best) return;
    best.pop = .01;
    if (best.bad){ buzz(15); }
    else { lives--; buzz([60,40,60]); flash("Era un pezzo buono!"); hud(); }
  };
  stopGame = () => { running = false; cancelAnimationFrame(raf); stopGame = () => {}; };
  show("factory");
  // show() calls stopGame first, so re-assign after
  stopGame = () => { running = false; cancelAnimationFrame(raf); stopGame = () => {}; };
  size(); score = 0; lives = maxLives; hud(); msg = "Pronto?"; items = []; draw(0);
  btn.style.display = "block"; btn.textContent = "Avvia la linea ▶"; btn.onclick = go;
}

/* ---------- PUZZLE ---------- */
function startPuzzle(){
  const P = CFG.puzzle, words = (P.words || []).map(w => ({ word:String(w.word||"").toUpperCase().replace(/[^A-ZÀ-Ü]/g,""), hint:w.hint })).filter(w => w.word);
  $("#pTitle").textContent = P.title; $("#pIntro").textContent = P.intro;
  const panel = $("#pPanel");
  let wi = 0;
  function shuffle(s){ const a = s.split(""); for (let k = 0; k < 20; k++){ for (let i = a.length-1; i > 0; i--){ const j = Math.random()*(i+1)|0; [a[i],a[j]] = [a[j],a[i]]; } if (a.join("") !== s || s.length < 2) break; } return a; }
  function chips(){ return `<div class="wordsdone">${words.map((w,k)=>`<span class="${k<wi?"done":""}">${k<wi?esc(w.word):"Parola "+(k+1)}</span>`).join("")}</div>`; }
  function word(){
    if (wi >= words.length) return lock();
    const W = words[wi].word, letters = shuffle(W).map((ch, id) => ({ ch, id, used:false }));
    let picked = [];
    panel.innerHTML = chips() + `<div class="slots" id="slots"></div><div class="tiles" id="tiles"></div><div class="whint" id="whint"></div>
      <div class="row2"><button class="btn secondary" id="bHint">💡 Indizio</button><button class="btn secondary" id="bHelp">🪄 Aiutino</button><button class="btn secondary" id="bClr">⌫</button></div>`;
    const slots = $("#slots"), tiles = $("#tiles");
    function render(){
      slots.innerHTML = ""; tiles.innerHTML = "";
      for (let k = 0; k < W.length; k++){
        const s = document.createElement("div"); s.className = "slot" + (picked[k] ? " filled" : ""); s.textContent = picked[k]?.ch || "";
        s.onclick = () => { if (!picked[k] || picked[k].locked) return; picked[k].used = false; picked.splice(k); render(); };
        slots.appendChild(s);
      }
      letters.forEach(l => { const b = document.createElement("button"); b.className = "tile" + (l.used ? " used" : ""); b.textContent = l.ch;
        b.onclick = () => { if (l.used || picked.length >= W.length) return; l.used = true; picked.push(l); buzz(8); render(); check(); }; tiles.appendChild(b); });
    }
    function check(){
      if (picked.length < W.length) return;
      if (picked.map(p => p.ch).join("") === W){
        slots.querySelectorAll(".slot").forEach(s => s.classList.add("solved")); buzz(40);
        setTimeout(() => { wi++; word(); }, 900);
      } else {
        slots.classList.add("shake"); buzz([40,40,40]);
        setTimeout(() => { slots.classList.remove("shake"); picked.forEach(p => { if (!p.locked) p.used = false; }); picked = picked.filter(p => p.locked); render(); }, 450);
      }
    }
    $("#bHint").onclick = () => $("#whint").textContent = words[wi].hint || "Nessun indizio… fidati dell'intuito!";
    $("#bHelp").onclick = () => {
      // ripulisce i non bloccati sbagliati e aggiunge la prossima lettera corretta
      let k = 0; while (k < picked.length && picked[k].ch === W[k]) { picked[k].locked = true; k++; }
      picked.slice(k).forEach(p => p.used = false); picked = picked.slice(0, k);
      if (k >= W.length) return;
      const l = letters.find(l => !l.used && l.ch === W[k]); if (!l) return;
      l.used = true; l.locked = true; picked.push(l); render(); check();
    };
    $("#bClr").onclick = () => { picked.forEach(p => { if (!p.locked) p.used = false; }); picked = picked.filter(p => p.locked); render(); };
    render();
  }
  function lock(){
    const code = words.map(w => String(w.word.length)).join("");
    panel.innerHTML = chips() + `<div class="result"><div class="big">🔐</div><p>${esc(P.finalPrompt)}</p></div>
      <div class="code" id="code">${code.split("").map(()=>`<input inputmode="numeric" maxlength="1" pattern="[0-9]*">`).join("")}</div>
      <div class="whint" id="lhint"></div><button class="btn" id="bOpen">Apri il lucchetto</button>`;
    const ins = [...panel.querySelectorAll(".code input")];
    ins.forEach((inp, k) => { inp.oninput = () => { inp.value = inp.value.replace(/\D/g,"").slice(-1); if (inp.value && ins[k+1]) ins[k+1].focus(); }; });
    let fails = 0;
    $("#bOpen").onclick = () => {
      if (ins.map(i => i.value).join("") === code){ buzz(60); panel.querySelector(".big").textContent = "🔓"; setTimeout(()=>win("puzzle"), 700); return; }
      fails++; $("#code").classList.add("shake"); buzz([40,40,40]); setTimeout(()=>$("#code").classList.remove("shake"),400);
      $("#lhint").textContent = fails >= 2 ? `Psst… ${words.map(w => w.word + " = " + w.word.length).join(", ")}` : "Conta bene le lettere!";
    };
  }
  show("puzzle"); word();
}

/* ---------- ENVELOPE ---------- */
function openEnvelope(n){
  const e = CFG.envelopes[n-1] || {};
  $("#ovTitle").textContent = "Hai vinto!";
  $("#ovN").textContent = e.title || "Busta n. " + n;
  $("#ovMsg").textContent = e.message || "";
  $("#ovSeal").textContent = n;
  const ov = $("#overlay"); ov.classList.remove("open"); ov.classList.add("show");
  requestAnimationFrame(() => requestAnimationFrame(() => ov.classList.add("open")));
  setTimeout(() => confetti(), 1000); buzz([30,60,30]);
}
$("#ovClose").onclick = () => { $("#overlay").classList.remove("show","open"); show("home"); };

/* ---------- FINAL ---------- */
function startFinal(){
  const X = CFG.final;
  $("#xTitle").textContent = X.title; $("#xMsg").textContent = X.message;
  $("#xHints").innerHTML = ""; $("#xDone").style.display = "none";
  show("final");
  const cv = $("#scratchCanvas"), ctx = cv.getContext("2d");
  const d = devicePixelRatio || 1, W = cv.clientWidth, H = cv.clientHeight;
  cv.width = W*d; cv.height = H*d; ctx.setTransform(d,0,0,d,0,0); cv.style.opacity = 1; cv.style.transition = "opacity .6s";
  const g = ctx.createLinearGradient(0,0,W,H); g.addColorStop(0,"#b8862e"); g.addColorStop(.5,"#f3d68a"); g.addColorStop(1,"#a8741f");
  ctx.globalCompositeOperation = "source-over"; ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
  ctx.fillStyle = "#5b1023"; ctx.font = "800 20px 'Playfair Display', serif"; ctx.textAlign = "center";
  ctx.fillText("✨ GRATTA QUI ✨", W/2, H/2 + 7);
  for (let i = 0; i < 40; i++){ ctx.fillStyle = "rgba(255,255,255,.25)"; ctx.fillRect(Math.random()*W, Math.random()*H, 2, 2); }
  let down = false, done = !!PROG.final_claimed_at, moves = 0;
  if (done){ cv.style.opacity = 0; $("#xDone").style.display = "block"; return; }
  function scratch(e){
    const r = cv.getBoundingClientRect();
    ctx.globalCompositeOperation = "destination-out"; ctx.fillStyle = "#000"; ctx.beginPath(); ctx.arc(e.clientX - r.left, e.clientY - r.top, 26, 0, 7); ctx.fill();
    if (++moves % 12 === 0) checkDone();
  }
  function checkDone(){
    const px = ctx.getImageData(0,0,cv.width,cv.height).data; let clear = 0;
    for (let i = 3; i < px.length; i += 64) if (px[i] < 40) clear++;
    if (clear / (px.length/64) > .45) reveal();
  }
  async function reveal(){
    if (done) return; done = true; cv.style.opacity = 0; buzz([50,80,50,80,120]); confetti(true);
    if (!PREVIEW) PROG = await DB.claimFinal(); else PROG.final_claimed_at = new Date().toISOString();
    $("#xDone").style.display = "block";
  }
  cv.onpointerdown = e => { down = true; cv.setPointerCapture(e.pointerId); scratch(e); };
  cv.onpointermove = e => { if (down && !done) scratch(e); };
  cv.onpointerup = cv.onpointercancel = () => { down = false; if (!done) checkDone(); };
}

/* ---------- CONFETTI ---------- */
function confetti(big){
  const cv = $("#confetti"), ctx = cv.getContext("2d"), d = devicePixelRatio || 1;
  cv.width = innerWidth*d; cv.height = innerHeight*d; ctx.setTransform(d,0,0,d,0,0);
  const cols = ["#f3d68a","#d4a84b","#ffffff","#b2263f","#2f8f5b"];
  const ps = Array.from({ length: big ? 220 : 130 }, () => ({ x: innerWidth/2 + (Math.random()-.5)*80, y: innerHeight*.45, vx:(Math.random()-.5)*14, vy:-Math.random()*16-4,
    s:5+Math.random()*7, r:Math.random()*6, vr:(Math.random()-.5)*.4, c:cols[Math.random()*cols.length|0] }));
  const t0 = performance.now();
  (function f(t){
    ctx.clearRect(0,0,innerWidth,innerHeight);
    for (const p of ps){ p.vy += .35; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2); ctx.restore(); }
    if (t - t0 < 4000) requestAnimationFrame(f); else ctx.clearRect(0,0,innerWidth,innerHeight);
  })(t0);
}

/* ---------- boot ---------- */
async function boot(){
  try { CFG = await DB.loadConfig(); } catch(e){}
  if (PREVIEW) { try { const d = JSON.parse(localStorage.getItem("buste.previewConfig") || "null"); if (d) CFG = DB.merge(window.DEFAULT_CONFIG, d); } catch(e){} }
  if (!PREVIEW) { try { PROG = await DB.loadProgress(); } catch(e){} }
  renderHome();
}
boot();
document.addEventListener("visibilitychange", async () => {
  if (document.visibilityState === "visible" && !PREVIEW && $("#home").classList.contains("active")) {
    try { CFG = await DB.loadConfig(); PROG = await DB.loadProgress(); renderHome(); } catch(e){}
  }
});
if ("serviceWorker" in navigator && !PREVIEW) navigator.serviceWorker.register("sw.js").catch(()=>{});
})();
</script>
